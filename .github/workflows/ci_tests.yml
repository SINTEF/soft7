name: CI - Tests

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'push-action/**'  # For the CasperWA/push-protected action

jobs:
  basics:
    name: External
    uses: SINTEF/ci-cd/.github/workflows/ci_tests.yml@v2.11.0
    with:
      # General
      install_extras: '[dev]'

      # pre-commit
      run_pre-commit: false  # Uses pre-commit.ci (see config file .pre-commit-config.yaml)

      # pylint & safety
      run_pylint: false
      run_safety: false

      # Build Python package
      run_build_package: true
      python_version_package: '3.11'
      build_libs: flit
      build_cmd: flit build

      # Documentation
      run_build_docs: false

  pip-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install -U pip
        pip install -U setuptools wheel
        pip install -U -r .github/utils/requirements_audit.txt

    - name: Prepare for pip-audit
      # The deprecated `oteapi` extra is not audited (see #222).
      run: pip-compile --output-file="${{ runner.temp }}/requirements.txt" --extra=dev --extra=docs --extra=graph --extra=testing --allow-unsafe --verbose --color "${{ github.workspace }}/pyproject.toml"

    - name: Run pip-audit
      uses: pypa/gh-action-pip-audit@v1.1.0
      with:
        inputs: '${{ runner.temp }}/requirements.txt'

  pytest:
    name: pytest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Supported Python versions (according to pyproject.toml)
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        extras: ['testing']
        include:
          # Legacy: Ensure the deprecated OTEAPI-related functionality still works,
          # and emits deprecation warnings. Remove together with the `oteapi` extra
          # (see #222).
          - python-version: '3.11'
            extras: 'oteapi,testing'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install -U pip
        pip install -U setuptools wheel
        pip install -e .[${{ matrix.extras }}]

    - name: Run pytest
      run: pytest -v -rs --cov=s7 --cov-report=xml --cov-report=term-missing --color=yes

    - name: Upload code coverage report
      if: github.repository == 'SINTEF/soft7'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        flags: pytest
        env_vars: PYTHON,EXTRAS
      env:
        PYTHON: ${{ matrix.python-version }}
        EXTRAS: ${{ matrix.extras }}
